name: Feature request
description: Propose a new limit, platform backend, report field, or CLI capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        CLI flags, exit codes, report schemas, measurement rules, and signal
        behavior are compatibility-sensitive. Please describe those effects.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The workload or failure mode the current behavior cannot address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the interface, platform behavior, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing operating-system controls or wrapper approaches you considered.
    validations:
      required: false
